name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # These four checks validate readiness for the HACS *default store*,
          # not the integration itself. They cannot pass from CI here:
          #
          #   topics / description / issues
          #     GitHub repository settings, not repository content. They also
          #     fail on every fork, because forks start without a description
          #     and with issues disabled.
          #   brands
          #     Requires either custom_components/dhl_tracking/brand/icon.png
          #     or a `dhl_tracking` entry in home-assistant/brands. Neither
          #     exists; see README "HACS-Standardstore" for what it takes.
          #
          # The checks that validate the repository content - hacs.json, the
          # integration manifest, the license, the information file and the
          # archived state - still run and still gate this job.
          ignore: topics description issues brands

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest
