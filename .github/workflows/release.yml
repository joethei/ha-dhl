name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger bei Tags wie v0.0.1, v1.0.0, etc.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
    - name: Update manifest.json version
      run: |
        # Extrahiere Version ohne 'v' Prefix für manifest.json
        VERSION_NUM=${GITHUB_REF#refs/tags/v}
        
        # Aktualisiere version in manifest.json
        sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION_NUM\"/" custom_components/dhl_tracking/manifest.json
        
        echo "Updated manifest.json version to: $VERSION_NUM"
        grep version custom_components/dhl_tracking/manifest.json
        
    - name: Create ZIP for HACS
      run: |
        # HACS erwartet bei zip_release ein Archiv, dessen *Inhalt* direkt in
        # custom_components/dhl_tracking/ entpackt wird.
        cd custom_components/dhl_tracking
        zip -r ../../dhl_tracking.zip . -x '*.pyc' -x '__pycache__/*'
        cd ../..
        
        # Zeige Inhalt zur Verifikation
        echo "ZIP Contents:"
        unzip -l dhl_tracking.zip
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: DHL Tracking ${{ steps.version.outputs.VERSION }}
        body: |
          ## 🚀 DHL Tracking ${{ steps.version.outputs.VERSION }}
          
          ### ✨ Features
          - 📦 Verfolge mehrere DHL-Sendungen gleichzeitig
          - 🔄 Adaptives Polling innerhalb des DHL-Tageskontingents
          - 🌍 Unterstützt internationale DHL-Sendungen  
          - 📱 Einfache Konfiguration über die Home Assistant UI
          - ➕ Sendungen zur Laufzeit hinzufügen/entfernen (Actions + Options Flow)
          
          ### 📋 Installation
          - **HACS**: Füge `https://github.com/pascatl/ha-dhl` als Custom Repository hinzu
          - **Manuell**: Lade `dhl_tracking.zip` herunter und extrahiere in `custom_components/dhl_tracking/`
          
          ### ⚙️ Voraussetzungen
          - Home Assistant 2025.2.0 oder neuer
          - DHL Developer API-Schlüssel
          
          ---
          
          📥 **Für HACS**: Automatischer Download  
          📥 **Für manuelle Installation**: Lade `dhl_tracking.zip` herunter
        files: dhl_tracking.zip
        draft: false
        prerelease: false
