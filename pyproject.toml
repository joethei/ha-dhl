[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "SIM",  # flake8-simplify
    "RUF",  # ruff specific
    "T20",  # flake8-print
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant", "custom_components", "tests"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
